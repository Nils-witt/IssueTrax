version: "2"
sql:
  - engine: postgresql
    schema: internal/adapter/storage/postgres/migrations
    queries: internal/adapter/storage/postgres/queries
    gen:
      go:
        package: sqlc
        out: internal/adapter/storage/postgres/sqlc
        sql_package: pgx/v5
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
