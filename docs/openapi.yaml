openapi: 3.1.0
info:
  title: IssueTrax API
  version: "1.0"
  description: |
    JSON API of IssueTrax, a simple project-scoped issue tracker.

    This document is hand-written documentation; the Go handlers in
    `internal/adapter/httpapi` are the source of truth.

    **Authentication.** Browsers sign in via OpenID Connect (Authentik):
    navigate to `GET /auth/login?returnTo=/path`, which ends at
    `/auth/callback` and sets an HttpOnly session cookie
    (`__Host-issuetrax_session`, 24 h, not extended). Every `/api` endpoint
    except `/api/version` and `/api/openapi.yaml` requires that cookie and answers `401` with code
    `unauthenticated` without it.

    **Service accounts.** Automations call the API as a service account,
    a user named `bot-<name>`, created by a signed-in person under
    `/api/service-accounts`. They send an API key as
    `Authorization: Bearer itx_…`. A request with an `Authorization`
    header is judged by that header alone; an unknown, malformed, expired
    or revoked key answers `401` with code `invalid_api_key`. Service
    accounts can do everything a person can, except manage service
    accounts and keys (`403`, code `session_required`).

    **Admins and the audit log.** People whose identity provider `groups`
    claim contained the group configured as `ISSUETRAX_OIDC_ADMIN_GROUP` at
    their latest sign-in are admins (`admin` in `/api/me`). Only they may
    read `/api/audit-log`; others get `403` with code `admin_required`.

    **CSRF.** State-changing requests (`POST`, `PATCH`, `DELETE`) must be same-origin
    (checked via `Sec-Fetch-Site` / `Origin`); cross-origin ones get `403`
    with code `cross_origin_rejected`.

    **Errors.** Every error has the shape of `Error`. `code` is stable and
    meant for clients to translate; `message` is English; `fields` maps
    input fields to codes on validation errors (`422`).

    **Pagination.** Lists return `items`, the `total` number of matches and
    an opaque `nextCursor` (null on the last page). Pass it back as
    `cursor` with the same filters to get the next page.
servers:
  - url: /
security:
  - session: []
  - apiKey: []

tags:
  - name: auth
  - name: projects
  - name: issues
  - name: tags
  - name: comments
  - name: attachments
  - name: storages
  - name: item-types
    description: |
      A tree of item types. Every storage item has a type. A type names the
      modules (with a count) new items start with; children inherit their
      ancestors' defaults (the deepest count wins, a single module is
      defaulted once) and the nearest asset tag prefix. Everyone may read
      types; only admins may change them (`admin_required`). Deleting a type
      only marks it deleted: its children and items keep working, but it
      cannot get new or moved-in children or be given to items, and its name
      is free again among its siblings.
  - name: manufacturers
    description: |
      The central list of manufacturers and their hardware models that
      `hardware` modules pick from. Everyone may read and change it.
      Manufacturer names are unique among live manufacturers and model names
      among the live models of one manufacturer, both ignoring case.
      Deleting a manufacturer or model only marks it deleted: items keep
      it, but it cannot be picked for items any more (and a deleted
      manufacturer gets no new models), and its name is free again.
      Renaming an entry renames it on every item that names it.
  - name: storage-items
    description: |
      Things kept in a storage. Every item has an asset tag (unique ignoring
      case, deleted items included, never changed), a name, a storage, a
      type and a `usable` flag, plus optional order, commissioning and
      decommissioning dates (in that order), a decommissioning reason and a
      responsible person (no service accounts). All other fields come from
      modules, which are added and removed per item: `hardware`,
      `networkHost`, `purchase`, `simCard`, `wwan`, `operatingSystem` and `sipClient` at most once, `network_interface` any
      number of times with at most one primary. Modules keep their `id`
      across updates when it is sent back. Deleting an item only marks it
      deleted (`deletedAt`); deleted items are hidden from lists unless
      `deleted=true`, cannot be changed, and can be restored.

      Validation errors name nested fields by path, e.g.
      `modules[1].networkInterface.ipv4.dnsServers[0]`.
  - name: users
  - name: service-accounts
  - name: audit
  - name: events

paths:
  /auth/login:
    get:
      tags: [auth]
      summary: Start sign-in (browser navigation)
      security: []
      parameters:
        - name: returnTo
          in: query
          description: Local path to open after sign-in. Anything that is not a local path becomes `/`.
          schema: { type: string, example: /p/TRAX }
      responses:
        "302":
          description: Redirect to the identity provider; sets a short-lived signed login cookie.

  /auth/callback:
    get:
      tags: [auth]
      summary: Finish sign-in (called by the identity provider)
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302":
          description: Signed in; sets the session cookie and redirects to `returnTo`.
        "400":
          description: Sign-in failed (HTML page with a retry link).

  /auth/logout:
    post:
      tags: [auth]
      summary: Sign out
      description: Deletes the session and clears the cookie. Navigate to `redirectUrl` to also end the identity provider session.
      security: []
      responses:
        "200":
          description: Signed out.
          content:
            application/json:
              schema:
                type: object
                required: [redirectUrl]
                properties:
                  redirectUrl: { type: string, format: uri-reference }
        "403": { $ref: "#/components/responses/CrossOrigin" }

  /api/version:
    get:
      tags: [auth]
      summary: Build information
      security: []
      responses:
        "200":
          description: Version and commit of the running binary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  commit: { type: string }

  /api/openapi.yaml:
    get:
      tags: [auth]
      summary: This API description
      security: []
      responses:
        "200":
          description: The OpenAPI document you are reading.
          content:
            application/yaml:
              schema: { type: string }

  /api/me:
    get:
      tags: [users]
      summary: The signed-in user
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/audit-log:
    get:
      tags: [audit]
      summary: Read the audit log (admins only)
      description: |
        Sign-ins, failed sign-ins, sign-outs and every change to projects,
        issues, tags, comments, service accounts and API keys, newest
        first. Filters combine with AND.
      security: [{ session: [] }]
      parameters:
        - name: actor
          in: query
          description: Only entries by this user.
          schema: { type: string, format: uuid }
        - name: action
          in: query
          description: Only these actions (repeatable).
          schema: { type: array, items: { $ref: "#/components/schemas/AuditAction" } }
          style: form
          explode: true
        - name: targetType
          in: query
          description: Only entries about this kind of entity.
          schema: { $ref: "#/components/schemas/AuditTargetType" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEntryPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`admin_required` (not an admin) or `session_required` (API keys cannot read the audit log)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Validation" }

  /api/events:
    get:
      tags: [events]
      summary: Live change notifications (WebSocket)
      description: |
        Upgrades to a WebSocket that the server sends one JSON text message
        per committed change on (`ChangeEvent`). Messages name what changed,
        not the new data: reload it through the regular endpoints. The
        stream is server-to-client only; a data message from the client
        closes it.

        Browsers authenticate with the session cookie and must connect from
        the app's own origin (other origins get `403`); service accounts send
        `Authorization: Bearer itx_…`. Credentials are checked again every
        minute: once they are no longer valid the server closes with code
        `4401`. It closes with `1013` (try again later) when the client falls
        behind and `1001` when shutting down. A client that reconnects has
        missed changes and should reload everything it shows.
      responses:
        "101":
          description: Switching to the WebSocket protocol; then `ChangeEvent` messages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeEvent" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: The `Origin` is neither the server's host nor the public URL.
        "426":
          description: Not a WebSocket handshake.

  /api/users:
    get:
      tags: [users]
      summary: List users
      description: Everyone who has signed in at least once, ordered by display name. Only these users can be assigned.
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/projects:
    get:
      tags: [projects]
      summary: List projects
      description: Ordered by name (A→Z, ignoring case).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of projects.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/Validation" }
    post:
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProject" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "409":
          description: "`project_key_taken` or `project_name_taken`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Validation" }

  /api/projects/{key}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [projects]
      summary: Get a project
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [projects]
      summary: Update a project
      description: Partial update. The key is immutable; sending it yields `422` with field code `immutable`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProject" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`project_name_taken`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Validation" }

  /api/projects/{key}/tags:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [tags]
      summary: List the project's tags
      description: Ordered by name. Tags are created by assigning a new name to an issue.
      responses:
        "200":
          description: Tags.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Tag" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{key}/tags/{tagId}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - name: tagId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [tags]
      summary: Rename or recolor a tag
      description: |
        Partial update; absent fields stay unchanged. Tags cannot be deleted.
        The name is normalized like on creation; the color is lower-cased.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, example: Needs Review }
                color: { type: string, pattern: "^#[0-9a-fA-F]{6}$", example: "#1D76DB" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`tag_name_taken`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Validation" }

  /api/projects/{key}/issues:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [issues]
      summary: List issues
      description: |
        Newest first (highest number). Different criteria combine with AND.
        Without `status`, archived issues are hidden.
      parameters:
        - name: status
          in: query
          description: Repeat to include several statuses.
          schema:
            type: array
            items: { $ref: "#/components/schemas/IssueStatus" }
          style: form
          explode: true
        - name: tag
          in: query
          description: Tag IDs; repeat for several.
          schema: { type: array, items: { type: string, format: uuid } }
          style: form
          explode: true
        - name: tagMode
          in: query
          description: "`all` (default): the issue has every given tag; `any`: at least one."
          schema: { $ref: "#/components/schemas/MatchMode" }
        - name: assignee
          in: query
          description: User IDs; repeat for several.
          schema: { type: array, items: { type: string, format: uuid } }
          style: form
          explode: true
        - name: assigneeMode
          in: query
          description: "`all` (default) or `any`, as for tags."
          schema: { $ref: "#/components/schemas/MatchMode" }
        - name: storageItem
          in: query
          description: IDs of linked storage items of any kind; repeat for several.
          schema: { type: array, items: { type: string, format: uuid } }
          style: form
          explode: true
        - name: storageItemMode
          in: query
          description: "`all` (default) or `any`, as for tags."
          schema: { $ref: "#/components/schemas/MatchMode" }
        - name: q
          in: query
          description: Case-insensitive substring searched in title and description (max 200 characters).
          schema: { type: string, maxLength: 200 }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of issues.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuePage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    post:
      tags: [issues]
      summary: Create an issue
      description: Unknown tag names are created in the project.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateIssue" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /api/projects/{key}/issues/{number}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - name: number
        in: path
        required: true
        description: The project-scoped number (42 in TRAX-42).
        schema: { type: integer, format: int64, minimum: 1 }
    ServiceAccountID:
      name: id
      in: path
      required: true
      description: The service account's user ID.
      schema: { type: string, format: uuid }
    get:
      tags: [issues]
      summary: Get an issue
      responses:
        "200":
          description: The issue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [issues]
      summary: Update an issue
      description: |
        Partial update: absent fields stay unchanged; `tags`, `assignees`
        and `storageItems` replace the whole set. An archived issue accepts only a request that
        changes nothing but `status` (unarchive first, then edit); anything
        else yields `409` with code `issue_archived`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateIssue" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`issue_archived`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Validation" }

  /api/projects/{key}/issues/{number}/comments:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/IssueNumber"
    get:
      tags: [comments]
      summary: List an issue's comments
      description: All comments, oldest first (not paginated).
      responses:
        "200":
          description: Comments.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Comment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [comments]
      summary: Comment on an issue
      description: The signed-in user becomes the author. Archived issues accept no new comments.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentBody" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IssueArchived" }
        "422": { $ref: "#/components/responses/Validation" }

  /api/projects/{key}/issues/{number}/comments/{commentId}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/IssueNumber"
      - name: commentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [comments]
      summary: Edit a comment
      description: |
        Replaces the body. Only the author may edit (`403` with code
        `not_comment_author` otherwise); comments on archived issues cannot
        change. `updatedAt` only moves when the body actually changes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentBody" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IssueArchived" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [comments]
      summary: Delete a comment
      description: Permanently removes the comment. Only the author may delete it; comments on archived issues cannot be deleted.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IssueArchived" }

  /api/projects/{key}/issues/{number}/attachments:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/IssueNumber"
    get:
      tags: [attachments]
      summary: List an issue's attachments
      description: All attachments (metadata only), oldest first (not paginated).
      responses:
        "200":
          description: Attachments.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Attachment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [attachments]
      summary: Attach a file to an issue
      description: |
        Uploads one file as `multipart/form-data` in the field `file`; other
        fields are ignored. The part's file name (reduced to its base name)
        and `Content-Type` are stored as sent. Files must be 1 byte to
        10 MiB (`fields.file`: `required` or `too_long`); the file name must
        be at most 255 bytes without control characters (`fields.fileName`).
        The signed-in user becomes the uploader. Archived issues accept no
        new attachments.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "400":
          description: "The body is not a well-formed multipart form (`invalid_upload`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IssueArchived" }
        "422": { $ref: "#/components/responses/Validation" }

  /api/projects/{key}/issues/{number}/attachments/{attachmentId}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/IssueNumber"
      - name: attachmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [attachments]
      summary: Download an attachment
      description: |
        Serves the file. PNG, JPEG, GIF and WebP images (detected from the
        content) are served `inline` with their detected type; everything
        else is served with the stored media type as a download
        (`Content-Disposition: attachment`). Responses carry a sandboxing
        `Content-Security-Policy`, an `ETag` and support `Range` and
        conditional requests. Attachments of archived issues stay readable.
      responses:
        "200":
          description: The file.
          headers:
            Content-Disposition:
              schema: { type: string, example: "attachment; filename=report.pdf" }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206": { description: Partial content for a `Range` request. }
        "304": { description: Not modified (`If-None-Match` / `If-Modified-Since`). }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [attachments]
      summary: Delete an attachment
      description: |
        Permanently removes the attachment and its content. Only the
        uploader may delete it (`403` with code `not_attachment_uploader`
        otherwise); attachments of archived issues cannot be deleted.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IssueArchived" }

  /api/storages:
    get:
      tags: [storages]
      summary: List storages under one parent
      description: |
        The direct children of `parent`, or the root storages when `parent`
        is absent, ordered by name (A→Z, ignoring case). Each item carries
        its `childCount`, so trees can load lazily.
      parameters:
        - name: parent
          in: query
          description: Parent storage ID; omit for the roots.
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of storages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoragePage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    post:
      tags: [storages]
      summary: Create a storage
      description: An unknown `parentId` yields `422` with field code `invalid` on `parentId`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateStorage" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Storage" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "409":
          description: "`storage_name_taken`: a sibling already has the name."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Validation" }

  /api/storages/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [storages]
      summary: Get a storage
      responses:
        "200":
          description: The storage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Storage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [storages]
      summary: Rename or move a storage
      description: |
        Partial update; absent fields stay unchanged. `parentId` moves the
        storage (`null` makes it a root). Storages cannot be deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateStorage" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Storage" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`storage_name_taken` (a sibling has the name) or `storage_cycle` (the new parent lies in the storage's own subtree)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Validation" }

  /api/item-types:
    get:
      tags: [item-types]
      summary: List or search item types
      description: |
        Without `q`, the children of `parent` (the roots without it) — the
        tree is loaded level by level. With `q`, types of the whole tree whose
        name contains it, each with its `path`. Ordered by name (A→Z,
        ignoring case), then ID.
      parameters:
        - name: parent
          in: query
          schema: { type: string, format: uuid }
        - name: q
          in: query
          schema: { type: string }
        - name: includeDeleted
          in: query
          description: Also list deleted types.
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of types (`ItemTypeView`s when searching).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemTypePage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    post:
      tags: [item-types]
      summary: Create an item type (admins only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateItemType" }
      responses:
        "201":
          description: The new type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemTypeView" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`item_type_name_taken` (a live sibling has the name) or `item_type_deleted` (the parent is deleted)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Validation" }

  /api/item-types/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [item-types]
      summary: Get an item type with what it inherits
      description: Deleted types are returned too.
      responses:
        "200":
          description: The type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemTypeView" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [item-types]
      summary: Rename, move, re-prefix or change the defaults of a type (admins only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateItemType" }
      responses:
        "200":
          description: The updated type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemTypeView" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`item_type_name_taken`, `item_type_cycle` (moved into its own subtree) or `item_type_deleted` (the type or the new parent is deleted)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [item-types]
      summary: Delete an item type (admins only)
      description: Only marks the type deleted; its children and items keep it.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`item_type_deleted`: the type already is deleted."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/item-types/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [item-types]
      summary: Restore a deleted item type (admins only)
      responses:
        "200":
          description: The restored type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemTypeView" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`item_type_not_deleted`, or `item_type_name_taken` when a live sibling took the name meanwhile."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/item-types/{id}/next-asset-tag:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [item-types]
      summary: Propose the asset tag for a new item of the type
      description: |
        The effective prefix of the type (or the server's default prefix)
        followed by the next number of that prefix's counter, at least five
        digits, skipping tags in use (`NET-00042`). Nothing is reserved: two
        clients may get the same proposal, and the second create fails with
        `asset_tag_taken`. Creating an item with exactly this tag advances
        the counter; other tags leave it alone.
      responses:
        "200":
          description: The proposal.
          content:
            application/json:
              schema:
                type: object
                required: [assetTag]
                properties:
                  assetTag: { type: string, example: NET-00042 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`item_type_deleted`: the type is deleted."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

