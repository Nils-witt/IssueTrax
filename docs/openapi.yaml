        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /api/service-accounts:
    get:
      tags: [service-accounts]
      summary: List service accounts
      description: All service accounts, ordered by display name. Requires a signed-in person.
      security: [{ session: [] }]
      responses:
        "200":
          description: Service accounts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServiceAccount" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/SessionRequired" }
    post:
      tags: [service-accounts]
      summary: Create a service account
      description: |
        Creates the user `bot-<name>`. The name is lower-cased and a leading
        `bot-` is dropped, so `CI` and `bot-ci` both create `bot-ci`.
        Service accounts cannot be deleted; revoke their keys instead.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateServiceAccount" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceAccount" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/SessionRequired" }
        "409":
          description: "`service_account_name_taken`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Validation" }

  /api/service-accounts/{id}/keys:
    parameters:
      - $ref: "#/components/parameters/ServiceAccountID"
    get:
      tags: [service-accounts]
      summary: List a service account's API keys
      description: Newest first, including revoked and expired keys. Tokens are never returned here.
      security: [{ session: [] }]
      responses:
        "200":
          description: Keys.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/APIKey" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/SessionRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [service-accounts]
      summary: Create an API key
      description: |
        Issues a new key. The response is the only place the `token` ever
        appears; only its SHA-256 is stored. A service account may have
        several keys, e.g. to rotate without downtime.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAPIKey" }
      responses:
        "201":
          description: Created; keep the token now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedAPIKey" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/SessionRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /api/service-accounts/{id}/keys/{keyId}:
    parameters:
      - $ref: "#/components/parameters/ServiceAccountID"
      - name: keyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [service-accounts]
      summary: Revoke an API key
      description: The key stops working immediately. It stays listed with `revokedAt` set. Revoking twice is fine.
      security: [{ session: [] }]
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/SessionRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-issuetrax_session
      description: Set by `/auth/callback`. Named `issuetrax_session` in development mode.
    apiKey:
      type: http
      scheme: bearer
      description: A service account's API key (`itx_…`), created via `POST /api/service-accounts/{id}/keys`.

  parameters:
    CatalogQuery:
      name: q
      in: query
      description: Keep entries whose name contains this, ignoring case.
      schema: { type: string }
    CatalogIncludeDeleted:
      name: includeDeleted
      in: query
      description: Also list deleted entries.
      schema: { type: boolean, default: false }
    StorageItemDeleted:
      name: deleted
      in: query
      description: List only deleted items instead of only live ones.
      schema: { type: boolean, default: false }
    StorageItemQuery:
      name: q
      in: query
      description: |
        Keep items whose name, description, asset tag, manufacturer, model,
        serial number, host name or interface MAC contains this text,
        ignoring case. A MAC in any notation matches exactly.
      schema: { type: string }
    StorageItemType:
      name: typeId
      in: query
      description: Keep items of this type.
      schema: { type: string, format: uuid }
    StorageItemIncludeSubtypes:
      name: includeSubtypes
      in: query
      description: With `typeId`, also keep items of its descendant types.
      schema: { type: boolean, default: false }
    StorageItemUsable:
      name: usable
      in: query
      description: Keep only usable (true) or unusable (false) items.
      schema: { type: boolean }
    StorageItemResponsible:
      name: responsibleId
      in: query
      description: Keep items this user is responsible for.
      schema: { type: string, format: uuid }
    StorageItemDecommissioned:
      name: decommissioned
      in: query
      description: Keep items with (true) or without (false) a decommissioning date.
      schema: { type: boolean }
    ProjectKey:
      name: key
      in: path
      required: true
      description: Project key, case-insensitive (TRAX).
      schema: { type: string, example: TRAX }
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: "`nextCursor` from the previous page."
      schema: { type: string }
    IssueNumber:
      name: number
      in: path
      required: true
      description: The project-scoped number (42 in TRAX-42).
      schema: { type: integer, format: int64, minimum: 1 }

  responses:
    StorageItemDeleted:
      description: "`storage_item_deleted`: the item is deleted; restore it first."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: "No valid session (`unauthenticated`) or API key (`invalid_api_key`)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "`project_not_found`, `issue_not_found`, `tag_not_found`, `comment_not_found`, `attachment_not_found`, `storage_not_found`, `storage_item_not_found`, `item_type_not_found`, `manufacturer_not_found`, `hardware_model_not_found`, `service_account_not_found`, `api_key_not_found` or `not_found`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Validation:
      description: "`validation_failed`; `fields` names the offending inputs."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: validation_failed
              message: validation failed
              fields: { title: required, tags: invalid }
    InvalidJSON:
      description: "The body is not a single JSON object of the expected shape (`invalid_json`); unknown fields are rejected."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CrossOrigin:
      description: "Cross-origin state-changing request (`cross_origin_rejected`)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: "`not_comment_author` (the comment belongs to someone else), `not_attachment_uploader` (someone else uploaded the attachment) or `cross_origin_rejected`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SessionRequired:
      description: "`session_required`: service accounts cannot manage service accounts or keys."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    IssueArchived:
      description: "`issue_archived`: the issue is archived and read-only."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code.
              examples: [issue_archived, validation_failed, project_not_found]
            message:
              type: string
              description: Human-readable English message.
            fields:
              type: object
              description: "Validation only: field → code (`required`, `too_long`, `invalid`, `unknown`, `out_of_range`, `immutable`)."
              additionalProperties: { type: string }

    IssueStatus:
      type: string
      enum: [draft, open, closed, archived]

    MatchMode:
      type: string
      enum: [all, any]
      default: all

    User:
      type: object
      required: [id, email, displayName, serviceAccount]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, description: Empty for service accounts. }
        displayName: { type: string }
        serviceAccount: { type: boolean, description: "True for `bot-<name>` users that use API keys." }

    Me:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [admin]
          properties:
            admin: { type: boolean, description: "Member of the admin group at the latest sign-in; may read the audit log." }

    AuditAction:
      type: string
      enum:
        - auth.login
        - auth.login_failed
        - auth.logout
        - project.create
        - project.update
        - issue.create
        - issue.update
        - tag.update
        - comment.create
        - comment.update
        - comment.delete
        - attachment.create
        - attachment.delete
        - storage.create
        - storage.update
        - storage_item.create
        - storage_item.update
        - storage_item.delete
        - storage_item.restore
        - item_type.create
        - item_type.update
        - item_type.delete
        - item_type.restore
        - manufacturer.create
        - manufacturer.update
        - manufacturer.delete
        - manufacturer.restore
        - hardware_model.create
        - hardware_model.update
        - hardware_model.delete
        - hardware_model.restore
        - service_account.create
        - api_key.create
        - api_key.revoke

    ChangeEvent:
      type: object
      required: [type, project]
      description: |
        A committed change. `project`: a project was created or updated
        (reload the project list and that project). `tags`: a project's tags
        were renamed or recolored (reload its tags and issues). `issue`: an
        issue was created or updated, possibly creating tags (reload it, the
        project's issue list and tags). `comments`: an issue's comments
        changed. `attachments`: a file was attached to or removed from an
        issue. `storages`: a storage was created, renamed or moved (reload
        storages); `project` is empty because storages are global.
        `storageItems`: an item kept in a storage was created, changed,
        moved, deleted or restored (reload item lists, storages and item
        types, whose `itemCount` may have changed); `project` is empty.
        `itemTypes`: an item type was created, changed, moved, deleted or
        restored (reload item types and items, which show their type's
        name); `project` is empty. `manufacturers`: a manufacturer or
        hardware model was created, renamed, deleted or restored (reload
        manufacturers, models and items, which show their names); `project`
        is empty.
      properties:
        type: { type: string, enum: [project, tags, issue, comments, attachments, storages, storageItems, itemTypes, manufacturers] }
        project: { type: string, example: TRAX, description: "Empty for `storages`, `storageItems`, `itemTypes` and `manufacturers`." }
        issue:
          type: integer
          format: int64
          description: The issue number, for `issue`, `comments` and `attachments` only.
          example: 42
      example: { type: issue, project: TRAX, issue: 42 }

    AuditTargetType:
      type: string
      enum: [user, project, issue, tag, comment, attachment, storage, storage_item, item_type, service_account, api_key]

    AuditChange:
      type: object
      description: |
        One changed field. `old` is absent for fields set on creation.
        Long text (descriptions, comment bodies) is `redacted`: only the
        fact that it changed is recorded. Lists (tags, assignees, storage items by name) are
        comma-separated and sorted.
      properties:
        old: { type: string }
        new: { type: string }
        redacted: { type: boolean }

    AuditEntry:
      type: object
      required: [id, at, actor, action, targetType, targetId, targetLabel, changes, ip, userAgent]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        actor:
          description: Who acted; null for failed sign-ins.
          oneOf:
            - type: "null"
            - type: object
              required: [id, displayName, serviceAccount]
              properties:
                id: { type: string, format: uuid }
                displayName: { type: string }
                serviceAccount: { type: boolean }
        action: { $ref: "#/components/schemas/AuditAction" }
        targetType: { type: string, description: "An AuditTargetType; empty for failed sign-ins." }
        targetId: { type: string }
        targetLabel: { type: string, description: "Display snapshot, e.g. `TRAX-12` or `bot-ci: deploy`." }
        changes:
          type: object
          additionalProperties: { $ref: "#/components/schemas/AuditChange" }
          example:
            title: { old: Crash, new: Crash on start }
            description: { redacted: true }
        ip: { type: string, description: "Client address as seen by the server (a reverse proxy's address when behind one)." }
        userAgent: { type: string }

    AuditEntryPage:
      type: object
      required: [items, total, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        total: { type: integer, format: int64 }
        nextCursor: { type: [string, "null"] }

    ServiceAccount:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [name, createdAt]
          properties:
            name: { type: string, description: "The name without `bot-`.", example: ci }
            createdAt: { type: string, format: date-time }

    CreateServiceAccount:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          description: "`^[a-z0-9][a-z0-9-]{0,39}$` after lower-casing and dropping a leading `bot-`."
          example: ci

    APIKey:
      type: object
      required: [id, name, prefix, createdBy, createdAt, expiresAt, lastUsedAt, revokedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: What the key is for. }
        prefix: { type: string, description: "The token's first characters, to tell keys apart.", example: itx_AbCd1234 }
        createdBy: { type: string, format: uuid, description: The person who created the key. }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time, description: Updated at most once a minute. }
        revokedAt: { type: [string, "null"], format: date-time }

    CreatedAPIKey:
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [token]
          properties:
            token: { type: string, description: "Send as `Authorization: Bearer <token>`. Shown only once.", example: itx_AbCd1234… }

    CreateAPIKey:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, description: "Required, at most 100 characters.", example: GitHub Actions }
        expiresAt:
          type: [string, "null"]
          format: date-time
          description: Optional; must lie in the future (`out_of_range` otherwise).

    Project:
      type: object
      required: [id, key, name, description, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, pattern: "^[A-Z][A-Z0-9]{1,9}$", example: TRAX }
        name: { type: string, maxLength: 100 }
        description: { type: string, description: Markdown }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateProject:
      type: object
      required: [key, name]
      additionalProperties: false
      properties:
        key:
          type: string
          description: "2–10 characters A-Z/0-9 starting with a letter; lower case is upper-cased. Immutable."
          example: trax
        name: { type: string, minLength: 1, maxLength: 100, description: Unique ignoring case. }
        description: { type: string, description: Markdown, at most 256 KiB. }

    UpdateProject:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string }

    Tag:
      type: object
      required: [id, name, color]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,29}$", example: needs-review }
        color:
          type: string
          pattern: "^#[0-9a-f]{6}$"
          example: "#1d76db"
          description: Display color. New tags get a palette color derived from their name.

    TagNames:
      type: array
      description: |
        Tag names. Each is normalized (trimmed, lower-cased, runs of spaces or
        underscores become `-`, so "Needs Review" → `needs-review`) and must
        then match `^[a-z0-9][a-z0-9-]{0,29}$`. Unknown names are created.
      items: { type: string }

    Issue:
      type: object
      required: [id, key, number, projectKey, title, description, status, tags, assignees, storageItems, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: TRAX-42 }
        number: { type: integer, format: int64, example: 42 }
        projectKey: { type: string, example: TRAX }
        title: { type: string, maxLength: 200 }
        description: { type: string, description: Markdown }
        status: { $ref: "#/components/schemas/IssueStatus" }
        tags:
          type: array
          description: Ordered by name.
          items: { $ref: "#/components/schemas/Tag" }
        assignees:
          type: array
          description: Ordered by display name.
          items: { $ref: "#/components/schemas/User" }
        storageItems:
          type: array
          description: Linked storage items of any kind, deleted ones included; ordered by name (ignoring case).
          items: { $ref: "#/components/schemas/StorageItemRef" }
        createdBy: { $ref: "#/components/schemas/User" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Comment:
      type: object
      required: [id, body, author, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        body: { type: string, description: Markdown }
        author: { $ref: "#/components/schemas/User" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, description: Equals `createdAt` until the body is edited. }

    Attachment:
      type: object
      required: [id, fileName, mediaType, size, uploader, createdAt]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string, example: screenshot.png }
        mediaType:
          type: string
          description: As declared by the uploader (normalized), `application/octet-stream` when missing or malformed. Not verified against the content.
          example: image/png
        size: { type: integer, format: int64, description: In bytes. }
        uploader: { $ref: "#/components/schemas/User" }
        createdAt: { type: string, format: date-time }

    CommentBody:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body:
          type: string
          description: Markdown, trimmed; required and at most 256 KiB.
          example: "Reproduced on **Firefox** too."

    CreateIssue:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, description: Markdown, at most 256 KiB. }
        status:
          allOf: [{ $ref: "#/components/schemas/IssueStatus" }]
          default: open
        tags: { $ref: "#/components/schemas/TagNames" }
        assignees:
          type: array
          description: User IDs of users who have signed in before.
          items: { type: string, format: uuid }
        storageItems:
          type: array
          description: |
            IDs of storage items of any kind to link. Unknown or deleted items
            yield `422` with field code `unknown` on `storageItems`.
          items: { type: string, format: uuid }

    UpdateIssue:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string }
        status: { $ref: "#/components/schemas/IssueStatus" }
        tags: { $ref: "#/components/schemas/TagNames" }
        assignees:
          type: array
          items: { type: string, format: uuid }
        storageItems:
          type: array
          description: |
            IDs of storage items to link. Items already linked stay allowed
            after they were deleted; newly linked ones must exist and not be
            deleted (else `422`, field code `unknown`).
          items: { type: string, format: uuid }

    ProjectPage:
      type: object
      required: [items, total, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Project" } }
        total: { type: integer, format: int64 }
        nextCursor: { type: [string, "null"] }

    IssuePage:
      type: object
      required: [items, total, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Issue" } }
        total: { type: integer, format: int64 }
        nextCursor: { type: [string, "null"] }

    Storage:
      type: object
      required: [id, parentId, name, childCount, itemCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        parentId: { type: [string, "null"], format: uuid, description: Null for a root storage. }
        name: { type: string, maxLength: 100, example: Shelf A }
        childCount: { type: integer, format: int64, description: Number of direct children. }
        itemCount: { type: integer, format: int64, description: Number of items (any kind, not deleted) kept directly in it. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateStorage:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: Unique among siblings ignoring case. }
        parentId: { type: [string, "null"], format: uuid, description: Parent storage; absent or null for a root. }

    UpdateStorage:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        parentId: { type: [string, "null"], format: uuid, description: New parent; null moves the storage to the root. }

    StoragePage:
      type: object
      required: [items, total, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Storage" } }
        total: { type: integer, format: int64 }
        nextCursor: { type: [string, "null"] }

    StorageItemRef:
      type: object
      description: A storage item as linked from issues.
      required: [id, assetTag, storageId, name, deleted]
      properties:
        id: { type: string, format: uuid }
        assetTag: { type: string, example: NET-00042 }
        storageId: { type: string, format: uuid, description: The storage the item is kept in. }
        name: { type: string, example: Core switch }
        deleted: { type: boolean }

    ModuleKind:
      type: string
      description: "`hardware`, `network_host`, `purchase`, `sim_card`, `wwan`, `operating_system` and `sip_client` occur at most once per item; `network_interface` any number of times."
      enum: [hardware, network_host, purchase, sim_card, wwan, operating_system, sip_client, network_interface]

    ModuleDefault:
      type: object
      required: [module, count]
      additionalProperties: false
      properties:
        module: { $ref: "#/components/schemas/ModuleKind" }
        count: { type: integer, minimum: 1, maximum: 512, description: Always 1 for single modules. }

    ItemTypeRef:
      type: object
      required: [id, name, deleted]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Switch }
        deleted: { type: boolean }

    ItemType:
      type: object
      required: [id, parentId, name, tagPrefix, defaults, childCount, itemCount, createdAt, updatedAt, deletedAt]
      properties:
        id: { type: string, format: uuid }
        parentId: { type: [string, "null"], format: uuid, description: Null for a root type. }
        name: { type: string, maxLength: 100, example: Switch }
        tagPrefix: { type: string, maxLength: 20, description: "Starts proposed asset tags, separator included (`NET-`); empty inherits it.", example: NET- }
        defaults:
          type: array
          items: { $ref: "#/components/schemas/ModuleDefault" }
          description: The type's own defaults in display order, without the inherited ones.
        childCount: { type: integer, format: int64, description: Direct children, deleted ones included. }
        itemCount: { type: integer, format: int64, description: Live items of exactly this type. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: [string, "null"], format: date-time, description: Null unless the type is deleted. }

    ItemTypeView:
      allOf:
        - $ref: "#/components/schemas/ItemType"
        - type: object
          required: [path, effectiveDefaults, effectiveTagPrefix]
          properties:
            path:
              type: array
              items: { $ref: "#/components/schemas/ItemTypeRef" }
              description: The ancestors from the root down to the parent.
            effectiveDefaults:
              type: array
              items: { $ref: "#/components/schemas/ModuleDefault" }
              description: The defaults of the type merged with its ancestors' (the deepest count wins).
            effectiveTagPrefix: { type: string, description: The prefix proposed asset tags start with. }

    ItemTypePage:
      type: object
      required: [items, total, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ItemType" } }
        total: { type: integer, format: int64 }
        nextCursor: { type: [string, "null"] }

    CreateItemType:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        parentId: { type: [string, "null"], format: uuid, description: A live type; absent or null creates a root. }
        tagPrefix: { type: string, maxLength: 20, pattern: "^[A-Za-z0-9._/-]*$" }
        defaults: { type: array, items: { $ref: "#/components/schemas/ModuleDefault" }, description: Each module at most once. }

    UpdateItemType:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        parentId: { type: [string, "null"], format: uuid, description: Moves the type under this live type; null makes it a root. }
        tagPrefix: { type: string, maxLength: 20, pattern: "^[A-Za-z0-9._/-]*$", description: Empty inherits the prefix. }
        defaults: { type: array, items: { $ref: "#/components/schemas/ModuleDefault" }, description: Replaces the type's own defaults. }

    Hardware:
      type: object
      required: [manufacturerId, modelId, serialNumber]
      description: |
        Manufacturer and model come from the central list. A model needs its
        manufacturer and must belong to it. Newly picked entries must be
        live; ones an item already has may have been deleted since.
        Responses also carry the named entries; requests leave them out.
      properties:
        manufacturerId: { type: [string, "null"], format: uuid }
        modelId: { type: [string, "null"], format: uuid }
        serialNumber: { type: string, maxLength: 100 }
        manufacturer:
          readOnly: true
          oneOf: [{ $ref: "#/components/schemas/CatalogRef" }, { type: "null" }]
        model:
          readOnly: true
          oneOf: [{ $ref: "#/components/schemas/CatalogRef" }, { type: "null" }]

    CatalogRef:
      type: object
      required: [id, name, deleted]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: ACME }
        deleted: { type: boolean }

    CatalogName:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }

    Manufacturer:
      type: object
      required: [id, name, modelCount, itemCount, createdAt, updatedAt, deletedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 100, example: ACME }
        modelCount: { type: integer, format: int64, description: Live models. }
        itemCount: { type: integer, format: int64, description: Live items whose hardware names the manufacturer. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: [string, "null"], format: date-time, description: Null unless deleted. }

    ManufacturerPage:
      type: object
      required: [items, total, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Manufacturer" } }
        total: { type: integer, format: int64 }
        nextCursor: { type: [string, "null"] }

    HardwareModel:
      type: object
      required: [id, manufacturerId, name, itemCount, createdAt, updatedAt, deletedAt]
      properties:
        id: { type: string, format: uuid }
        manufacturerId: { type: string, format: uuid }
        name: { type: string, maxLength: 100, example: S24 }
        itemCount: { type: integer, format: int64, description: Live items whose hardware names the model. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: [string, "null"], format: date-time, description: Null unless deleted. }

    HardwareModelPage:
      type: object
      required: [items, total, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/HardwareModel" } }
        total: { type: integer, format: int64 }
        nextCursor: { type: [string, "null"] }

    NetworkHost:
      type: object
      required: [role, hostname]
      properties:
        role: { $ref: "#/components/schemas/NetworkRole" }
        hostname: { type: string, maxLength: 253, description: RFC 1123 host name; may be empty. }

    Purchase:
      type: object
      required: [supplier, invoiceNumber, price, currency, warrantyEnd]
      properties:
        supplier: { type: string, maxLength: 100 }
        invoiceNumber: { type: string, maxLength: 100 }
        price:
          type: [string, "null"]
          pattern: "^[0-9]{1,12}(\\.[0-9]{1,2})?$"
          description: Decimal with at most two decimals; responses always have two. Null when unknown.
          example: "1299.00"
        currency: { type: string, description: "ISO 4217 code (upper case); required with a price and empty without one.", example: EUR }
        warrantyEnd: { type: [string, "null"], format: date-time }

    SimCard:
      type: object
      required: [provider, phoneNumber, iccid, imsi]
      description: |
        A SIM card placed in the device. Every field may be empty. Spaces,
        hyphens, slashes, dots and parentheses are removed from `phoneNumber`,
        `iccid` and `imsi` before validation and are not returned.
      properties:
        provider: { type: string, maxLength: 100, example: Telekom }
        phoneNumber:
          type: string
          pattern: "^(\\+?[0-9]{3,15})?$"
          description: Optional "+" and 3 to 15 digits.
          example: "+491711234567"
        iccid:
          type: string
          pattern: "^(89[0-9]{16,20})?$"
          description: ITU-T E.118 ICCID, 18 to 22 digits starting with 89; the check digit is not verified.
          example: "89490200001234567890"
        imsi:
          type: string
          pattern: "^([0-9]{6,15})?$"
          description: ITU-T E.212 IMSI, 6 to 15 digits (country code, network code, subscriber number).
          example: "262011234567890"

    WWAN:
      type: object
      required: [imei, apn, technology, simCardItemId]
      description: |
        The device's mobile (cellular) connection. Every field may be empty.
        Spaces, hyphens, slashes, dots and parentheses are removed from
        `imei` before validation and are not returned.
      properties:
        imei:
          type: string
          pattern: "^([0-9]{15})?$"
          description: 3GPP TS 23.003 IMEI, 15 digits whose last digit is a valid Luhn check digit.
          example: "490154203237518"
        apn: { type: string, maxLength: 100, example: internet.telekom }
        technology:
          type: string
          enum: ["", 2g, 3g, 4g, 5g]
          description: Mobile network generation; empty when unknown.
          example: 5g
        simCardItemId:
          type: [string, "null"]
          format: uuid
          description: |
            Another storage item used as this connection's SIM card. It must
            carry a `sim_card` module, be live when newly picked and not be
            the item itself; one already named may have been deleted since.
        simCardItem:
          readOnly: true
          description: The item `simCardItemId` names; responses only.
          oneOf: [{ $ref: "#/components/schemas/StorageItemRef" }, { type: "null" }]

    OperatingSystem:
      type: object
      required: [name, version]
      description: The operating system installed on the device. Both fields may be empty.
      properties:
        name: { type: string, maxLength: 100, example: Debian }
        version: { type: string, maxLength: 100, example: "12" }

    SIPClient:
      type: object
      required: [server, port, transport, username, extension]
      description: |
        The device's SIP (VoIP) account. Every field may be empty; the
        password is not stored. Spaces, hyphens, slashes, dots and
        parentheses are removed from `extension` before validation and are
        not returned.
      properties:
        server:
          type: string
          maxLength: 253
          description: Registrar or proxy, an RFC 1123 host name or an IP address (IPv6 without brackets); IP addresses come back in canonical form.
          example: pbx.example.org
        port:
          type: integer
          minimum: 0
          maximum: 65535
          description: Server port; 0 means the transport's default (5060, or 5061 for TLS).
          example: 5061
        transport:
          type: string
          enum: ["", udp, tcp, tls]
          description: Transport protocol; empty when unknown or the client default.
          example: tls
        username: { type: string, maxLength: 100, description: Authentication user name., example: ada-desk }
        extension:
          type: string
          pattern: "^(\\+?[0-9]{1,15})?$"
          description: Extension or phone number, an optional "+" and 1 to 15 digits.
          example: "1042"

    Module:
      type: object
      description: |
        One module instance. Exactly the payload matching `kind` is set:
        `hardware`, `networkHost`, `purchase`, `simCard`, `wwan`, `operatingSystem`, `sipClient` or `networkInterface`.
        `primary` is only allowed on `network_interface`, for at most one
        instance per item. In requests, send `id` to keep an existing
        instance and leave it out for a new one.
      required: [kind]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ModuleKind" }
        primary: { type: boolean, default: false }
        hardware: { $ref: "#/components/schemas/Hardware" }
        networkHost: { $ref: "#/components/schemas/NetworkHost" }
        purchase: { $ref: "#/components/schemas/Purchase" }
        simCard: { $ref: "#/components/schemas/SimCard" }
        wwan: { $ref: "#/components/schemas/WWAN" }
        operatingSystem: { $ref: "#/components/schemas/OperatingSystem" }
        sipClient: { $ref: "#/components/schemas/SIPClient" }
        networkInterface: { $ref: "#/components/schemas/NetworkInterface" }

    ModuleInput:
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ModuleKind" }
        primary: { type: boolean, default: false }
        hardware: { $ref: "#/components/schemas/Hardware" }
        networkHost: { $ref: "#/components/schemas/NetworkHost" }
        purchase: { $ref: "#/components/schemas/Purchase" }
        simCard: { $ref: "#/components/schemas/SimCard" }
        wwan: { $ref: "#/components/schemas/WWAN" }
        operatingSystem: { $ref: "#/components/schemas/OperatingSystem" }
        sipClient: { $ref: "#/components/schemas/SIPClient" }
        networkInterface: { $ref: "#/components/schemas/NetworkInterfaceInput" }

    StorageItem:
      type: object
      required:
        - id
        - assetTag
        - name
        - description
        - storageId
        - type
        - usable
        - orderDate
        - commissionedAt
        - decommissionedAt
        - decommissioningReason
        - personResponsible
        - modules
        - createdAt
        - updatedAt
        - deletedAt
      properties:
        id: { type: string, format: uuid }
        assetTag: { type: string, maxLength: 50, example: NET-00042 }
        name: { type: string, maxLength: 100, example: Core switch }
        description: { type: string, description: Plain text; may be empty. }
        storageId: { type: string, format: uuid, description: The storage the item is kept in. }
        type: { $ref: "#/components/schemas/ItemTypeRef" }
        usable: { type: boolean }
        orderDate: { type: [string, "null"], format: date-time }
        commissionedAt: { type: [string, "null"], format: date-time }
        decommissionedAt: { type: [string, "null"], format: date-time }
        decommissioningReason: { type: string, maxLength: 1000 }
        personResponsible:
          oneOf:
            - { $ref: "#/components/schemas/User" }
            - { type: "null" }
        modules:
          type: array
          items: { $ref: "#/components/schemas/Module" }
          description: "In display order: by kind (hardware, network host, purchase, interfaces), primary first, then by name."
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: [string, "null"], format: date-time, description: Null unless the item is deleted. }

    CreateStorageItem:
      type: object
      required: [assetTag, name, storageId, typeId, usable]
      additionalProperties: false
      description: Dates that are set must be in order (order ≤ commissioning ≤ decommissioning); violations are `out_of_order`.
      properties:
        assetTag: { type: string, minLength: 1, maxLength: 50, pattern: "^[A-Za-z0-9._/-]+$", description: Usually the proposal of `next-asset-tag`. }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, description: Plain text, at most 256 KiB. }
        storageId: { type: string, format: uuid }
        typeId: { type: string, format: uuid, description: A live item type. }
        usable: { type: boolean }
        orderDate: { type: [string, "null"], format: date-time }
        commissionedAt: { type: [string, "null"], format: date-time }
        decommissionedAt: { type: [string, "null"], format: date-time }
        decommissioningReason: { type: string, maxLength: 1000 }
        personResponsibleId: { type: [string, "null"], format: uuid, description: A person; service accounts are rejected. }
        modules: { type: array, items: { $ref: "#/components/schemas/ModuleInput" } }

    UpdateStorageItem:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, description: Plain text, at most 256 KiB; empty clears it. }
        storageId: { type: string, format: uuid, description: Moves the item to this storage. }
        typeId: { type: string, format: uuid, description: Retypes the item; the type must be live. Modules stay as sent. }
        usable: { type: boolean }
        orderDate: { type: [string, "null"], format: date-time }
        commissionedAt: { type: [string, "null"], format: date-time }
        decommissionedAt: { type: [string, "null"], format: date-time }
        decommissioningReason: { type: string, maxLength: 1000 }
        personResponsibleId: { type: [string, "null"], format: uuid }
        modules: { type: array, items: { $ref: "#/components/schemas/ModuleInput" }, description: Replaces all module instances. }

    StorageItemPage:
      type: object
      required: [items, total, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/StorageItem" } }
        total: { type: integer, format: int64 }
        nextCursor: { type: [string, "null"] }

    NetworkRole:
      type: string
      enum: [router, switch, client]

    IPv4Config:
      type: object
      required: [mode, address, prefixLength, gateway, dnsServers]
      description: |
        `address`, `prefixLength`, `gateway` and `dnsServers` are only set in
        `static` mode.
      properties:
        mode: { type: string, enum: [dhcp, static, "off"] }
        address: { type: [string, "null"], format: ipv4, example: 192.168.1.10 }
        prefixLength: { type: [integer, "null"], minimum: 0, maximum: 32, example: 24 }
        gateway: { type: [string, "null"], format: ipv4, description: Inside the address's subnet. }
        dnsServers: { type: array, items: { type: string, format: ipv4 } }

    IPv6Config:
      type: object
      required: [mode, address, prefixLength, gateway, dnsServers]
      description: |
        `address`, `prefixLength`, `gateway` and `dnsServers` are only set in
        `static` mode.
      properties:
        mode: { type: string, enum: [dhcp, slaac, static, "off"] }
        address: { type: [string, "null"], format: ipv6, example: "2001:db8::10" }
        prefixLength: { type: [integer, "null"], minimum: 0, maximum: 128, example: 64 }
        gateway:
          type: [string, "null"]
          format: ipv6
          description: Inside the address's subnet, or link-local (fe80::/10).
        dnsServers: { type: array, items: { type: string, format: ipv6 } }

    NetworkInterface:
      type: object
      required: [name, mac, type, ssid, nativeVlan, taggedVlans, ipv4, ipv6]
      properties:
        name: { type: string, maxLength: 100, example: eth0 }
        mac: { type: string, description: "EUI-48, lower case and colon-separated.", example: "aa:bb:cc:00:11:22" }
        type: { type: string, enum: [wired, wireless] }
        ssid: { type: string, description: Wireless network name; always empty for wired interfaces. }
        nativeVlan: { type: [integer, "null"], minimum: 1, maximum: 4094, description: Untagged VLAN. }
        taggedVlans: { type: array, items: { type: integer, minimum: 1, maximum: 4094 } }
        ipv4: { $ref: "#/components/schemas/IPv4Config" }
        ipv6: { $ref: "#/components/schemas/IPv6Config" }

    IPConfigInput:
      type: object
      required: [mode]
      additionalProperties: false
      description: |
        `slaac` is only valid for IPv6. In `static` mode `address` and
        `prefixLength` are required and `gateway` and `dnsServers` optional;
        addresses must be of the interface's family. In any other mode they
        must be absent.
      properties:
        mode: { type: string, enum: [dhcp, slaac, static, "off"] }
        address: { type: [string, "null"] }
        prefixLength: { type: [integer, "null"] }
        gateway: { type: [string, "null"] }
        dnsServers: { type: array, items: { type: string }, description: Distinct addresses. }

    NetworkInterfaceInput:
      type: object
      required: [name, mac, type, ipv4, ipv6]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        mac: { type: string, description: "EUI-48 in any common notation (aa:bb:…, AA-BB-…, aabb.cc…)." }
        type: { type: string, enum: [wired, wireless] }
        ssid: { type: [string, "null"], maxLength: 32, description: Only allowed for wireless interfaces. }
        nativeVlan: { type: [integer, "null"], minimum: 1, maximum: 4094 }
        taggedVlans:
          type: array
          items: { type: integer, minimum: 1, maximum: 4094 }
          description: Distinct, and not the native VLAN.
        ipv4: { $ref: "#/components/schemas/IPConfigInput" }
        ipv6: { $ref: "#/components/schemas/IPConfigInput" }
