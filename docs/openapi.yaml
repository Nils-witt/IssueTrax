          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Validation" }

  /api/storage-items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [storage-items]
      summary: Get an item
      description: Deleted items are returned too.
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [storage-items]
      summary: Edit, move or retype an item
      description: |
        Absent fields stay unchanged; null clears a date or the responsible
        person. `modules` replaces all module instances: send an instance's
        `id` to keep it (its kind cannot change), leave it out for a new one;
        instances not sent are removed. The asset tag cannot change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateStorageItem" }
      responses:
        "200":
          description: The updated item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageItem" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`storage_item_deleted`, `item_type_deleted` when retyping to a deleted type, or `manufacturer_deleted` / `hardware_model_deleted` when the hardware newly picks a deleted entry."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [storage-items]
      summary: Delete an item
      description: Only marks the item deleted; it can be restored.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StorageItemDeleted" }

