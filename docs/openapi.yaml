              schema: { $ref: "#/components/schemas/NetworkDevice" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`storage_item_not_deleted`: the device is not deleted."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/storage-items:
    get:
      tags: [storage-items]
      summary: Search items of every kind across all storages
      description: Ordered by name (A→Z, ignoring case), then ID.
      parameters:
        - name: q
          in: query
          description: Keep items whose name or description contains this text, ignoring case.
          schema: { type: string }
        - $ref: "#/components/parameters/StorageItemDeleted"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageItemRefPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/Validation" }

  /api/storage-items/{id}/issues:
    parameters:
      - name: id
        in: path
        required: true
        description: A storage item of any kind, deleted or not.
        schema: { type: string, format: uuid }
    get:
      tags: [storage-items]
      summary: List the issues linking an item
      description: Issues of every project and status, newest (created last) first.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of issues.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuePage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /api/service-accounts:
    get:
      tags: [service-accounts]
      summary: List service accounts
      description: All service accounts, ordered by display name. Requires a signed-in person.
      security: [{ session: [] }]
      responses:
        "200":
          description: Service accounts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServiceAccount" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/SessionRequired" }
    post:
      tags: [service-accounts]
      summary: Create a service account
      description: |
        Creates the user `bot-<name>`. The name is lower-cased and a leading
        `bot-` is dropped, so `CI` and `bot-ci` both create `bot-ci`.
        Service accounts cannot be deleted; revoke their keys instead.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateServiceAccount" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceAccount" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/SessionRequired" }
        "409":
          description: "`service_account_name_taken`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Validation" }

  /api/service-accounts/{id}/keys:
    parameters:
      - $ref: "#/components/parameters/ServiceAccountID"
    get:
      tags: [service-accounts]
      summary: List a service account's API keys
      description: Newest first, including revoked and expired keys. Tokens are never returned here.
      security: [{ session: [] }]
      responses:
        "200":
          description: Keys.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/APIKey" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/SessionRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [service-accounts]
      summary: Create an API key
      description: |
        Issues a new key. The response is the only place the `token` ever
        appears; only its SHA-256 is stored. A service account may have
        several keys, e.g. to rotate without downtime.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAPIKey" }
      responses:
        "201":
          description: Created; keep the token now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedAPIKey" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/SessionRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /api/service-accounts/{id}/keys/{keyId}:
    parameters:
      - $ref: "#/components/parameters/ServiceAccountID"
      - name: keyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [service-accounts]
      summary: Revoke an API key
      description: The key stops working immediately. It stays listed with `revokedAt` set. Revoking twice is fine.
      security: [{ session: [] }]
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/SessionRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-issuetrax_session
      description: Set by `/auth/callback`. Named `issuetrax_session` in development mode.
    apiKey:
      type: http
      scheme: bearer
      description: A service account's API key (`itx_…`), created via `POST /api/service-accounts/{id}/keys`.

  parameters:
    StorageItemDeleted:
      name: deleted
      in: query
      description: List only deleted items instead of only live ones.
      schema: { type: boolean, default: false }
    ProjectKey:
      name: key
      in: path
      required: true
      description: Project key, case-insensitive (TRAX).
      schema: { type: string, example: TRAX }
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: "`nextCursor` from the previous page."
      schema: { type: string }
    IssueNumber:
      name: number
      in: path
      required: true
      description: The project-scoped number (42 in TRAX-42).
      schema: { type: integer, format: int64, minimum: 1 }

  responses:
    StorageItemDeleted:
      description: "`storage_item_deleted`: the item is deleted; restore it first."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: "No valid session (`unauthenticated`) or API key (`invalid_api_key`)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "`project_not_found`, `issue_not_found`, `tag_not_found`, `comment_not_found`, `attachment_not_found`, `storage_not_found`, `storage_item_not_found`, `service_account_not_found`, `api_key_not_found` or `not_found`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Validation:
      description: "`validation_failed`; `fields` names the offending inputs."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: validation_failed
              message: validation failed
              fields: { title: required, tags: invalid }
    InvalidJSON:
      description: "The body is not a single JSON object of the expected shape (`invalid_json`); unknown fields are rejected."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CrossOrigin:
      description: "Cross-origin state-changing request (`cross_origin_rejected`)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: "`not_comment_author` (the comment belongs to someone else), `not_attachment_uploader` (someone else uploaded the attachment) or `cross_origin_rejected`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SessionRequired:
      description: "`session_required`: service accounts cannot manage service accounts or keys."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    IssueArchived:
      description: "`issue_archived`: the issue is archived and read-only."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code.
              examples: [issue_archived, validation_failed, project_not_found]
            message:
              type: string
              description: Human-readable English message.
            fields:
              type: object
              description: "Validation only: field → code (`required`, `too_long`, `invalid`, `unknown`, `out_of_range`, `immutable`)."
              additionalProperties: { type: string }

    IssueStatus:
      type: string
      enum: [draft, open, closed, archived]

    MatchMode:
      type: string
      enum: [all, any]
      default: all

    User:
      type: object
      required: [id, email, displayName, serviceAccount]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, description: Empty for service accounts. }
        displayName: { type: string }
        serviceAccount: { type: boolean, description: "True for `bot-<name>` users that use API keys." }

    Me:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [admin]
          properties:
            admin: { type: boolean, description: "Member of the admin group at the latest sign-in; may read the audit log." }

    AuditAction:
      type: string
      enum:
        - auth.login
        - auth.login_failed
        - auth.logout
        - project.create
        - project.update
        - issue.create
        - issue.update
        - tag.update
        - comment.create
        - comment.update
        - comment.delete
        - attachment.create
        - attachment.delete
        - storage.create
        - storage.update
        - generic_storage_item.create
        - generic_storage_item.update
        - generic_storage_item.delete
        - generic_storage_item.restore
        - network_device.create
        - network_device.update
        - network_device.delete
        - network_device.restore
        - service_account.create
        - api_key.create
        - api_key.revoke

    ChangeEvent:
      type: object
      required: [type, project]
      description: |
        A committed change. `project`: a project was created or updated
        (reload the project list and that project). `tags`: a project's tags
        were renamed or recolored (reload its tags and issues). `issue`: an
        issue was created or updated, possibly creating tags (reload it, the
        project's issue list and tags). `comments`: an issue's comments
        changed. `attachments`: a file was attached to or removed from an
        issue. `storages`: a storage was created, renamed or moved (reload
        storages); `project` is empty because storages are global.
        `storageItems`: an item kept in a storage was created, changed,
        moved, deleted or restored (reload item lists and storages, whose
        `itemCount` may have changed); `project` is empty.
      properties:
        type: { type: string, enum: [project, tags, issue, comments, attachments, storages, storageItems] }
        project: { type: string, example: TRAX, description: Empty for `storages` and `storageItems`. }
        issue:
          type: integer
          format: int64
          description: The issue number, for `issue`, `comments` and `attachments` only.
          example: 42
      example: { type: issue, project: TRAX, issue: 42 }

    AuditTargetType:
      type: string
      enum: [user, project, issue, tag, comment, attachment, storage, generic_storage_item, network_device, service_account, api_key]

    AuditChange:
      type: object
      description: |
        One changed field. `old` is absent for fields set on creation.
        Long text (descriptions, comment bodies) is `redacted`: only the
        fact that it changed is recorded. Lists (tags, assignees, storage items by name) are
        comma-separated and sorted.
      properties:
        old: { type: string }
        new: { type: string }
        redacted: { type: boolean }

    AuditEntry:
      type: object
      required: [id, at, actor, action, targetType, targetId, targetLabel, changes, ip, userAgent]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        actor:
          description: Who acted; null for failed sign-ins.
          oneOf:
            - type: "null"
            - type: object
              required: [id, displayName, serviceAccount]
              properties:
                id: { type: string, format: uuid }
                displayName: { type: string }
                serviceAccount: { type: boolean }
        action: { $ref: "#/components/schemas/AuditAction" }
        targetType: { type: string, description: "An AuditTargetType; empty for failed sign-ins." }
        targetId: { type: string }
        targetLabel: { type: string, description: "Display snapshot, e.g. `TRAX-12` or `bot-ci: deploy`." }
        changes:
          type: object
          additionalProperties: { $ref: "#/components/schemas/AuditChange" }
          example:
            title: { old: Crash, new: Crash on start }
            description: { redacted: true }
        ip: { type: string, description: "Client address as seen by the server (a reverse proxy's address when behind one)." }
        userAgent: { type: string }

    AuditEntryPage:
      type: object
      required: [items, total, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        total: { type: integer, format: int64 }
        nextCursor: { type: [string, "null"] }

    ServiceAccount:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [name, createdAt]
          properties:
            name: { type: string, description: "The name without `bot-`.", example: ci }
            createdAt: { type: string, format: date-time }

    CreateServiceAccount:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          description: "`^[a-z0-9][a-z0-9-]{0,39}$` after lower-casing and dropping a leading `bot-`."
          example: ci

    APIKey:
      type: object
      required: [id, name, prefix, createdBy, createdAt, expiresAt, lastUsedAt, revokedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: What the key is for. }
        prefix: { type: string, description: "The token's first characters, to tell keys apart.", example: itx_AbCd1234 }
        createdBy: { type: string, format: uuid, description: The person who created the key. }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time, description: Updated at most once a minute. }
        revokedAt: { type: [string, "null"], format: date-time }

    CreatedAPIKey:
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [token]
          properties:
            token: { type: string, description: "Send as `Authorization: Bearer <token>`. Shown only once.", example: itx_AbCd1234… }

    CreateAPIKey:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, description: "Required, at most 100 characters.", example: GitHub Actions }
        expiresAt:
          type: [string, "null"]
          format: date-time
          description: Optional; must lie in the future (`out_of_range` otherwise).

    Project:
      type: object
      required: [id, key, name, description, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, pattern: "^[A-Z][A-Z0-9]{1,9}$", example: TRAX }
        name: { type: string, maxLength: 100 }
        description: { type: string, description: Markdown }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateProject:
      type: object
      required: [key, name]
      additionalProperties: false
      properties:
        key:
          type: string
          description: "2–10 characters A-Z/0-9 starting with a letter; lower case is upper-cased. Immutable."
          example: trax
        name: { type: string, minLength: 1, maxLength: 100, description: Unique ignoring case. }
        description: { type: string, description: Markdown, at most 256 KiB. }

    UpdateProject:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string }

    Tag:
      type: object
      required: [id, name, color]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,29}$", example: needs-review }
        color:
          type: string
          pattern: "^#[0-9a-f]{6}$"
          example: "#1d76db"
          description: Display color. New tags get a palette color derived from their name.

    TagNames:
      type: array
      description: |
        Tag names. Each is normalized (trimmed, lower-cased, runs of spaces or
        underscores become `-`, so "Needs Review" → `needs-review`) and must
        then match `^[a-z0-9][a-z0-9-]{0,29}$`. Unknown names are created.
      items: { type: string }

    Issue:
      type: object
      required: [id, key, number, projectKey, title, description, status, tags, assignees, storageItems, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: TRAX-42 }
        number: { type: integer, format: int64, example: 42 }
        projectKey: { type: string, example: TRAX }
        title: { type: string, maxLength: 200 }
        description: { type: string, description: Markdown }
        status: { $ref: "#/components/schemas/IssueStatus" }
        tags:
          type: array
          description: Ordered by name.
          items: { $ref: "#/components/schemas/Tag" }
        assignees:
          type: array
          description: Ordered by display name.
          items: { $ref: "#/components/schemas/User" }
        storageItems:
          type: array
          description: Linked storage items of any kind, deleted ones included; ordered by name (ignoring case).
          items: { $ref: "#/components/schemas/StorageItemRef" }
        createdBy: { $ref: "#/components/schemas/User" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Comment:
      type: object
      required: [id, body, author, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        body: { type: string, description: Markdown }
        author: { $ref: "#/components/schemas/User" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, description: Equals `createdAt` until the body is edited. }

    Attachment:
      type: object
      required: [id, fileName, mediaType, size, uploader, createdAt]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string, example: screenshot.png }
        mediaType:
          type: string
          description: As declared by the uploader (normalized), `application/octet-stream` when missing or malformed. Not verified against the content.
          example: image/png
        size: { type: integer, format: int64, description: In bytes. }
        uploader: { $ref: "#/components/schemas/User" }
        createdAt: { type: string, format: date-time }

    CommentBody:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body:
          type: string
          description: Markdown, trimmed; required and at most 256 KiB.
          example: "Reproduced on **Firefox** too."

    CreateIssue:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, description: Markdown, at most 256 KiB. }
        status:
          allOf: [{ $ref: "#/components/schemas/IssueStatus" }]
          default: open
        tags: { $ref: "#/components/schemas/TagNames" }
        assignees:
          type: array
          description: User IDs of users who have signed in before.
          items: { type: string, format: uuid }
        storageItems:
          type: array
          description: |
            IDs of storage items of any kind to link. Unknown or deleted items
            yield `422` with field code `unknown` on `storageItems`.
          items: { type: string, format: uuid }

    UpdateIssue:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string }
        status: { $ref: "#/components/schemas/IssueStatus" }
        tags: { $ref: "#/components/schemas/TagNames" }
        assignees:
          type: array
          items: { type: string, format: uuid }
        storageItems:
          type: array
          description: |
            IDs of storage items to link. Items already linked stay allowed
            after they were deleted; newly linked ones must exist and not be
            deleted (else `422`, field code `unknown`).
          items: { type: string, format: uuid }

    ProjectPage:
      type: object
      required: [items, total, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Project" } }
        total: { type: integer, format: int64 }
        nextCursor: { type: [string, "null"] }

    IssuePage:
      type: object
      required: [items, total, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Issue" } }
        total: { type: integer, format: int64 }
        nextCursor: { type: [string, "null"] }

    Storage:
      type: object
      required: [id, parentId, name, childCount, itemCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        parentId: { type: [string, "null"], format: uuid, description: Null for a root storage. }
        name: { type: string, maxLength: 100, example: Shelf A }
        childCount: { type: integer, format: int64, description: Number of direct children. }
        itemCount: { type: integer, format: int64, description: Number of items (any kind, not deleted) kept directly in it. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateStorage:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: Unique among siblings ignoring case. }
        parentId: { type: [string, "null"], format: uuid, description: Parent storage; absent or null for a root. }

    UpdateStorage:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        parentId: { type: [string, "null"], format: uuid, description: New parent; null moves the storage to the root. }

    StoragePage:
      type: object
      required: [items, total, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Storage" } }
        total: { type: integer, format: int64 }
        nextCursor: { type: [string, "null"] }

    GenericStorageItem:
      type: object
      required: [id, storageId, name, description, createdAt, updatedAt, deletedAt]
      properties:
        id: { type: string, format: uuid }
        storageId: { type: string, format: uuid, description: The storage the item is kept in. }
        name: { type: string, maxLength: 100, example: Cordless drill }
        description: { type: string, description: Plain text; may be empty. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: [string, "null"], format: date-time, description: Null unless the item is deleted. }

    CreateGenericStorageItem:
      type: object
      required: [storageId, name]
      additionalProperties: false
      properties:
        storageId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, description: Plain text, at most 256 KiB. }

    UpdateGenericStorageItem:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, description: Plain text, at most 256 KiB; empty clears it. }
        storageId: { type: string, format: uuid, description: Moves the item to this storage. }

    GenericStorageItemPage:
      type: object
      required: [items, total, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/GenericStorageItem" } }
        total: { type: integer, format: int64 }
        nextCursor: { type: [string, "null"] }

    StorageItemKind:
      type: string
      enum: [generic, network_device]

    StorageItemRef:
      type: object
      description: The fields every kind of storage item shares.
      required: [id, kind, storageId, name, deleted]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/StorageItemKind" }
        storageId: { type: string, format: uuid, description: The storage the item is kept in. }
        name: { type: string, example: Cordless drill }
        deleted: { type: boolean }

    StorageItemRefPage:
      type: object
      required: [items, total, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/StorageItemRef" } }
        total: { type: integer, format: int64 }
        nextCursor: { type: [string, "null"] }

    NetworkRole:
      type: string
      enum: [router, switch, client]

    IPv4Config:
      type: object
      required: [mode, address, prefixLength, gateway, dnsServers]
      description: |
        `address`, `prefixLength`, `gateway` and `dnsServers` are only set in
        `static` mode.
      properties:
        mode: { type: string, enum: [dhcp, static, "off"] }
        address: { type: [string, "null"], format: ipv4, example: 192.168.1.10 }
        prefixLength: { type: [integer, "null"], minimum: 0, maximum: 32, example: 24 }
        gateway: { type: [string, "null"], format: ipv4, description: Inside the address's subnet. }
        dnsServers: { type: array, items: { type: string, format: ipv4 } }

    IPv6Config:
      type: object
      required: [mode, address, prefixLength, gateway, dnsServers]
      description: |
        `address`, `prefixLength`, `gateway` and `dnsServers` are only set in
        `static` mode.
      properties:
        mode: { type: string, enum: [dhcp, slaac, static, "off"] }
        address: { type: [string, "null"], format: ipv6, example: "2001:db8::10" }
        prefixLength: { type: [integer, "null"], minimum: 0, maximum: 128, example: 64 }
        gateway:
          type: [string, "null"]
          format: ipv6
          description: Inside the address's subnet, or link-local (fe80::/10).
        dnsServers: { type: array, items: { type: string, format: ipv6 } }

    NetworkInterface:
      type: object
      required: [name, mac, type, ssid, nativeVlan, taggedVlans, ipv4, ipv6]
      properties:
        name: { type: string, maxLength: 100, example: eth0 }
        mac: { type: string, description: "EUI-48, lower case and colon-separated.", example: "aa:bb:cc:00:11:22" }
        type: { type: string, enum: [wired, wireless] }
        ssid: { type: string, description: Wireless network name; always empty for wired interfaces. }
        nativeVlan: { type: [integer, "null"], minimum: 1, maximum: 4094, description: Untagged VLAN. }
        taggedVlans: { type: array, items: { type: integer, minimum: 1, maximum: 4094 } }
        ipv4: { $ref: "#/components/schemas/IPv4Config" }
        ipv6: { $ref: "#/components/schemas/IPv6Config" }

    NetworkDevice:
      type: object
      required:
        - id
        - storageId
        - name
        - description
        - role
        - hostname
        - manufacturer
        - model
        - serialNumber
        - primaryInterface
        - secondaryInterfaces
        - createdAt
        - updatedAt
        - deletedAt
      properties:
        id: { type: string, format: uuid }
        storageId: { type: string, format: uuid, description: The storage the device is kept in. }
        name: { type: string, maxLength: 100, example: Core router }
        description: { type: string, description: Plain text; may be empty. }
        role: { $ref: "#/components/schemas/NetworkRole" }
        hostname: { type: string, description: RFC 1123 host name; may be empty. }
        manufacturer: { type: string, maxLength: 100 }
        model: { type: string, maxLength: 100 }
        serialNumber: { type: string, maxLength: 100 }
        primaryInterface: { $ref: "#/components/schemas/NetworkInterface" }
        secondaryInterfaces: { type: array, items: { $ref: "#/components/schemas/NetworkInterface" } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: [string, "null"], format: date-time, description: Null unless the device is deleted. }

    IPConfigInput:
      type: object
      required: [mode]
      additionalProperties: false
      description: |
        `slaac` is only valid for IPv6. In `static` mode `address` and
        `prefixLength` are required and `gateway` and `dnsServers` optional;
        addresses must be of the interface's family. In any other mode they
        must be absent.
      properties:
        mode: { type: string, enum: [dhcp, slaac, static, "off"] }
        address: { type: [string, "null"] }
        prefixLength: { type: [integer, "null"] }
        gateway: { type: [string, "null"] }
        dnsServers: { type: array, items: { type: string }, description: Distinct addresses. }

    NetworkInterfaceInput:
      type: object
      required: [name, mac, type, ipv4, ipv6]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        mac: { type: string, description: "EUI-48 in any common notation (aa:bb:…, AA-BB-…, aabb.cc…)." }
        type: { type: string, enum: [wired, wireless] }
        ssid: { type: [string, "null"], maxLength: 32, description: Only allowed for wireless interfaces. }
        nativeVlan: { type: [integer, "null"], minimum: 1, maximum: 4094 }
        taggedVlans:
          type: array
          items: { type: integer, minimum: 1, maximum: 4094 }
          description: Distinct, and not the native VLAN.
        ipv4: { $ref: "#/components/schemas/IPConfigInput" }
        ipv6: { $ref: "#/components/schemas/IPConfigInput" }

    CreateNetworkDevice:
      type: object
      required: [storageId, name, role, primaryInterface]
      additionalProperties: false
      properties:
        storageId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, description: Plain text, at most 256 KiB. }
        role: { $ref: "#/components/schemas/NetworkRole" }
        hostname: { type: string, maxLength: 253 }
        manufacturer: { type: string, maxLength: 100 }
        model: { type: string, maxLength: 100 }
        serialNumber: { type: string, maxLength: 100 }
        primaryInterface: { $ref: "#/components/schemas/NetworkInterfaceInput" }
        secondaryInterfaces: { type: array, items: { $ref: "#/components/schemas/NetworkInterfaceInput" } }

    UpdateNetworkDevice:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, description: Plain text, at most 256 KiB; empty clears it. }
        storageId: { type: string, format: uuid, description: Moves the device to this storage. }
        role: { $ref: "#/components/schemas/NetworkRole" }
        hostname: { type: string, maxLength: 253, description: Empty clears it. }
        manufacturer: { type: string, maxLength: 100 }
        model: { type: string, maxLength: 100 }
        serialNumber: { type: string, maxLength: 100 }
        primaryInterface:
          $ref: "#/components/schemas/NetworkInterfaceInput"
        secondaryInterfaces:
          type: array
          items: { $ref: "#/components/schemas/NetworkInterfaceInput" }
          description: Replaces all secondary interfaces; empty removes them.

    NetworkDevicePage:
      type: object
      required: [items, total, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/NetworkDevice" } }
        total: { type: integer, format: int64 }
        nextCursor: { type: [string, "null"] }
