# Local development services. Start with `make dev-db`.
# Credentials here are for local development only.
name: issuetrax-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: issuetrax
      POSTGRES_PASSWORD: issuetrax
      POSTGRES_DB: issuetrax
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issuetrax -d issuetrax"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
