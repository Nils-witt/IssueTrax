# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Development-only Authentik setup for IssueTrax: an OAuth2/OpenID provider,
# the "issuetrax" application, an admin group and test users (ada is an
# admin, bob is not). Secrets here are dev values.
version: 1
metadata:
  name: IssueTrax development
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: issuetrax-provider
    identifiers:
      name: IssueTrax
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types:
        - authorization_code
      client_id: issuetrax-dev
      client_secret: issuetrax-dev-secret
      redirect_uris:
        # Vite dev server (make dev-frontend) and the Go server directly.
        - matching_mode: strict
          url: http://localhost:5173/auth/callback
        - matching_mode: strict
          url: http://localhost:8080/auth/callback
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        # The profile scope also sends the "groups" claim IssueTrax uses
        # to find admins (ISSUETRAX_OIDC_ADMIN_GROUP).
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    identifiers:
      slug: issuetrax
    attrs:
      name: IssueTrax
      provider: !KeyOf issuetrax-provider
      meta_launch_url: http://localhost:5173/

  - model: authentik_core.group
    id: issuetrax-admins
    identifiers:
      name: issuetrax-admins

  - model: authentik_core.user
    identifiers:
      username: ada
    attrs:
      name: Ada Lovelace
      email: ada@localhost.test
      password: ada
      groups:
        - !KeyOf issuetrax-admins

  - model: authentik_core.user
    identifiers:
      username: bob
    attrs:
      name: Bob Builder
      email: bob@localhost.test
      password: bob
