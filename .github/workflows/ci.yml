name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Go code embeds frontend/dist via go:embed, so every Go job needs the
  # built SPA. Build it once and share it as an artifact.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  lint:
    name: Go lint
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    name: Go test
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check generated sqlc code is up to date
        run: |
          go generate ./...
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

      - name: go vet
        run: go vet -tags integration ./...

      # Includes the Postgres integration tests; testcontainers uses the
      # runner's Docker daemon.
      - name: Test (unit + integration)
        run: go test -race -shuffle=on -count=1 -tags integration -coverprofile=coverage.out ./...

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

      - name: Build binary
        run: go build -o bin/issuetrax ./cmd/issuetrax

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
